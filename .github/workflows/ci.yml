# =============================================================================
#  MediConecta - integracion continua
# =============================================================================
#
#  Corre en cada push y en cada pull request:
#
#    1. calidad:      compila, linter (Checkstyle), tests unitarios y
#                     cobertura minima (JaCoCo). Publica el informe de
#                     cobertura y el WAR como artefactos.
#    2. migraciones:  aplica db/migraciones sobre un PostgreSQL vacio y vuelve
#                     a correrlas para comprobar que no rompen nada.
#    3. punta-a-punta: levanta todo con Docker Compose (base + migraciones +
#                     WildFly), espera al health check y corre la prueba de
#                     humo completa (scripts/smoke-test.sh).
#
#  Un cambio que rompa cualquiera de los tres queda marcado en rojo en GitHub.
# =============================================================================

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  calidad:
    name: Linter, tests y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: mvn verify (Checkstyle + JUnit + JaCoCo)
        run: mvn -B verify

      - name: Resumen de cobertura
        if: always()
        run: python3 scripts/ci/resumen-cobertura.py target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: WAR
        uses: actions/upload-artifact@v4
        with:
          name: mediconecta-war
          path: target/mediconecta.war

  migraciones:
    name: Migraciones sobre una base vacia
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mediconecta
          POSTGRES_USER: mediconecta
          POSTGRES_PASSWORD: clave-solo-para-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediconecta -d mediconecta"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FLYWAY_PASSWORD: clave-solo-para-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: flyway:migrate
        run: mvn -B flyway:migrate -Dflyway.url=jdbc:postgresql://localhost:5432/mediconecta

      - name: flyway:migrate otra vez (no debe aplicar nada) y flyway:validate
        run: mvn -B flyway:migrate flyway:validate flyway:info -Dflyway.url=jdbc:postgresql://localhost:5432/mediconecta

  punta-a-punta:
    name: Docker Compose + prueba de humo
    runs-on: ubuntu-latest
    needs: [calidad, migraciones]
    steps:
      - uses: actions/checkout@v4

      - name: Secretos de esta corrida
        run: |
          {
            echo "MEDICONECTA_DB_CLAVE=$(openssl rand -hex 24)"
            echo "MEDICONECTA_JWT_SECRETO=$(openssl rand -base64 48 | tr -d '\n')"
            echo "MEDICONECTA_DEMO_CLAVE=Demo.2026"
          } > .env

      - name: docker compose up
        run: docker compose up -d --build

      - name: Esperar al health check
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/mediconecta/api/salud; then echo; exit 0; fi
            sleep 5
          done
          echo "La aplicacion no quedo sana a tiempo"
          exit 1

      - name: Prueba de humo (123 verificaciones de punta a punta)
        run: MEDICONECTA_DEMO_CLAVE=Demo.2026 ./scripts/smoke-test.sh http://localhost:8080/mediconecta

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar
        if: always()
        run: docker compose down -v
