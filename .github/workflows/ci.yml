# =============================================================================
#  MediConecta - Integracion continua
# =============================================================================
#  build    compila con el Maven Wrapper (version fija de Maven), corre los
#           tests unitarios, genera la cobertura (JaCoCo) y falla si queda bajo
#           80 % de lineas o 70 % de ramas. Publica WAR, reportes y un resumen.
#  mutacion mutation testing con PIT; falla si el score queda bajo 60 %.
#  secretos busca secretos en TODO el historial de Git con gitleaks.
#  sonar    analisis en SonarCloud. Solo corre si el repositorio tiene el
#           secreto SONAR_TOKEN y las variables SONAR_ORGANIZATION y
#           SONAR_PROJECT_KEY; sin ellos se saltea (no hay credenciales en el codigo).
# =============================================================================
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, testear y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar, tests y umbrales de cobertura (mvnw verify)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

      - name: Resumen de tests y cobertura
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, glob, os
          import xml.etree.ElementTree as ET
          total = fallas = errores = omitidos = 0
          rotos = []
          for archivo in glob.glob('target/surefire-reports/TEST-*.xml'):
              raiz = ET.parse(archivo).getroot()
              total += int(raiz.get('tests', 0)); fallas += int(raiz.get('failures', 0))
              errores += int(raiz.get('errors', 0)); omitidos += int(raiz.get('skipped', 0))
              for caso in raiz.iter('testcase'):
                  if caso.find('failure') is not None or caso.find('error') is not None:
                      rotos.append(caso.get('classname') + '.' + caso.get('name'))
          print('## Tests unitarios')
          print(f'| Total | Fallas | Errores | Omitidos |\n|---|---|---|---|\n| {total} | {fallas} | {errores} | {omitidos} |')
          for r in rotos:
              print(f'- :x: `{r}`')
          ruta = 'target/site/jacoco/jacoco.csv'
          if os.path.exists(ruta):
              filas = list(csv.DictReader(open(ruta)))
              s = lambda k: sum(int(f[k]) for f in filas)
              lc, lm, bc, bm = s('LINE_COVERED'), s('LINE_MISSED'), s('BRANCH_COVERED'), s('BRANCH_MISSED')
              print('\n## Cobertura (JaCoCo, sin datos.jpa)')
              print(f'| Lineas | Ramas |\n|---|---|\n| {100*lc/(lc+lm):.1f} % ({lc}/{lc+lm}) | {100*bc/(bc+bm):.1f} % ({bc}/{bc+bm}) |')
              print('\nUmbral: 80 % lineas, 70 % ramas.')
          PY

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-tests-y-cobertura
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn

      - name: Publicar WAR
        uses: actions/upload-artifact@v4
        with:
          name: mediconecta-war
          path: target/mediconecta.war

  mutacion:
    name: Mutation testing (PIT)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: PIT (falla bajo 60 %)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Resumen de mutacion
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET
          ruta = 'target/pit-reports/mutations.xml'
          if os.path.exists(ruta):
              mutantes = ET.parse(ruta).getroot().findall('mutation')
              muertos = sum(1 for m in mutantes if m.get('status') in ('KILLED', 'TIMED_OUT', 'MEMORY_ERROR'))
              print(f'## Mutation score (PIT)\n{muertos}/{len(mutantes)} mutantes eliminados: **{100*muertos/max(1,len(mutantes)):.1f} %** (umbral 60 %)')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-pit
          path: target/pit-reports/
          if-no-files-found: warn

  secretos:
    name: Secretos en el historial (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        env:
          VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Escanear todos los commits
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1

  sonar:
    name: SonarCloud (opcional)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - name: Sin credenciales de Sonar
        if: env.SONAR_TOKEN == '' || env.SONAR_ORGANIZATION == '' || env.SONAR_PROJECT_KEY == ''
        run: echo "::notice::Sonar no configurado (SONAR_TOKEN / SONAR_ORGANIZATION / SONAR_PROJECT_KEY). Se omite el analisis."
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != ''
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != ''
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Analisis y Quality Gate
        if: env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != ''
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.qualitygate.wait=true
