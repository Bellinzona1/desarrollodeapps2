# =============================================================================
#  MediConecta - integracion continua
# =============================================================================
#
#  Corre en cada push y en cada pull request. Todo con ./mvnw (Maven fijado en
#  .mvn/wrapper) y JDK 17, para que el build sea reproducible.
#
#    1. calidad:       enforcer + linter (Checkstyle) + tests + cobertura
#                      (JaCoCo: 80 % de lineas en total y 80 % lineas / 70 %
#                      ramas en la capa de negocio). Publica informe y WAR.
#    2. mutacion:      PIT sobre la capa de negocio; falla con score < 60 %.
#    3. secretos:      gitleaks sobre TODO el historial del repositorio.
#    4. sonar:         analisis + Quality Gate obligatorio de SonarCloud.
#    5. migraciones:   db/migraciones sobre un PostgreSQL vacio, dos veces.
#    6. punta-a-punta: Docker Compose (base + migraciones + WildFly), prueba de
#                      humo completa, prueba de carga k6 (p95 < 500 ms) y
#                      escaneo OWASP ZAP (falla con alertas High).
# =============================================================================

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Propaga fallos de scanners y k6 aunque la salida se copie con tee.
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  calidad:
    name: Linter, tests y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Tres ejecuciones limpias (JUnit, PostgreSQL real y cobertura)
        run: |
          for corrida in 1 2 3; do
            ./mvnw -B clean verify
            mkdir -p "informes-estabilidad/$corrida"
            cp -R target/surefire-reports target/failsafe-reports "informes-estabilidad/$corrida/"
          done
          python3 scripts/ci/verificar-estabilidad.py informes-estabilidad/{1,2,3}

      - name: Evidencia de las tres ejecuciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estabilidad-junit
          path: informes-estabilidad/
          if-no-files-found: error

      - name: Resumen de cobertura
        if: always()
        run: python3 scripts/ci/resumen-cobertura.py target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: WAR
        uses: actions/upload-artifact@v4
        with:
          name: mediconecta-war
          path: target/mediconecta.war

  mutacion:
    name: Mutation testing (PIT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: PIT sobre la capa de negocio (minimo 60 %)
        run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Resumen de mutacion
        if: always()
        run: |
          if [ -f target/pit-reports/mutations.xml ]; then
            total=$(grep -c '<mutation ' target/pit-reports/mutations.xml)
            muertas=$(grep -c "status='KILLED'\|status=\"KILLED\"" target/pit-reports/mutations.xml || true)
            echo "### Mutation testing (PIT): $muertas de $total mutantes detectados" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Informe de PIT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutacion-pit
          path: target/pit-reports/
          if-no-files-found: ignore

  secretos:
    name: Sin secretos en el historial (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks sobre todos los commits
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --no-banner -v

  sonar:
    name: SonarCloud (Quality Gate)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Exigir configuracion del Quality Gate
        env:
          SONAR_ORGANIZACION: ${{ vars.SONAR_ORGANIZACION }}
          SONAR_PROYECTO: ${{ vars.SONAR_PROYECTO }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_ORGANIZACION" ] || [ -z "$SONAR_PROYECTO" ]; then
            echo "::error::Configurar SONAR_TOKEN, SONAR_ORGANIZACION y SONAR_PROYECTO. Sin analisis no se acredita el Quality Gate."
            exit 1
          fi

      - name: Analisis y espera del Quality Gate
        if: env.SONAR_TOKEN != ''
        run: >
          ./mvnw -B verify sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZACION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROYECTO }}
          -Dsonar.qualitygate.wait=true

      - name: Referencia del analisis Sonar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: referencia-sonar
          path: target/sonar/report-task.txt
          if-no-files-found: ignore

  migraciones:
    name: Migraciones sobre una base vacia
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mediconecta
          POSTGRES_USER: mediconecta
          POSTGRES_PASSWORD: clave-solo-para-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediconecta -d mediconecta"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FLYWAY_PASSWORD: clave-solo-para-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: flyway:migrate
        run: ./mvnw -B flyway:migrate -Dflyway.url=jdbc:postgresql://localhost:5432/mediconecta

      - name: flyway:migrate otra vez (no debe aplicar nada) y flyway:validate
        run: ./mvnw -B flyway:migrate flyway:validate flyway:info -Dflyway.url=jdbc:postgresql://localhost:5432/mediconecta

  punta-a-punta:
    name: Docker Compose + humo + carga + ZAP
    runs-on: ubuntu-latest
    needs: [calidad, migraciones]
    steps:
      - uses: actions/checkout@v4

      - name: Secretos de esta corrida
        run: |
          {
            echo "MEDICONECTA_DB_CLAVE=$(openssl rand -hex 24)"
            echo "MEDICONECTA_JWT_SECRETO=$(openssl rand -base64 48 | tr -d '\n')"
            echo "MEDICONECTA_DEMO_CLAVE=$(openssl rand -hex 12)"
          } > .env
          # Las pruebas leen la misma clave de demo que la aplicacion.
          grep MEDICONECTA_DEMO_CLAVE .env >> "$GITHUB_ENV"

      - name: docker compose up
        run: docker compose up -d --build

      - name: Esperar al health check
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/mediconecta/api/salud; then echo; exit 0; fi
            sleep 5
          done
          echo "La aplicacion no quedo sana a tiempo"
          exit 1

      - name: Prueba de humo (seguridad en vivo, ETag, idempotencia, JMS, DLQ, IA)
        run: ./scripts/smoke-test.sh http://localhost:8080/mediconecta

      - name: Pruebas E2E de la interfaz (Playwright, Chromium)
        run: |
          docker run --rm --network host --ipc=host -v "$PWD/pruebas/e2e:/e2e" -w /e2e \
            -e CI=true -e BASE_URL=http://localhost:8080/mediconecta -e MEDICONECTA_DEMO_CLAVE \
            mcr.microsoft.com/playwright:v1.49.1-noble sh -c "npm ci --no-audit --no-fund && npx playwright test"

      - name: Prueba de carga k6 (50 usuarios x 5 min, p95 < 500 ms, errores < 1 %)
        run: |
          docker run --rm -i --network host -e BASE_URL=http://localhost:8080/mediconecta -e CLAVE="$MEDICONECTA_DEMO_CLAVE" \
            grafana/k6:0.54.0 run --summary-trend-stats="avg,med,p(90),p(95),max" - < pruebas/carga/carga.js | tee k6.txt
          grep -E "http_req_duration|http_req_failed|checks" k6.txt | sed 's/^/    /' > k6-resumen.txt
          { echo "### Prueba de carga (k6)"; echo '```'; cat k6-resumen.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Escaneo OWASP ZAP (baseline, sin alertas High)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080/mediconecta/ -J zap.json -r zap.html -I
          altas=$(jq '[.site[].alerts[] | select(.riskcode=="3")] | length' zap/zap.json)
          medias=$(jq '[.site[].alerts[] | select(.riskcode=="2")] | length' zap/zap.json)
          echo "### OWASP ZAP: $altas alertas High, $medias Medium" >> "$GITHUB_STEP_SUMMARY"
          test "$altas" -eq 0

      - name: Informes de carga y ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carga-e2e-y-zap
          path: |
            k6.txt
            zap/
            pruebas/e2e/informe/
          if-no-files-found: ignore

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Analisis de dependencias (SCA): vulnerabilidades conocidas (CVE) en las
  # dependencias de Maven y npm del repositorio, y en la imagen Docker.
  # ---------------------------------------------------------------------------
  dependencias:
    name: Dependencias con vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy sobre el repositorio (corta ante HIGH o CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.58.1 fs --scanners vuln \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress /src | tee trivy-repo.txt

      - name: Trivy sobre la imagen Docker (corta ante HIGH o CRITICAL)
        run: |
          docker build -q -t mediconecta:sca .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress mediconecta:sca | tee trivy-imagen.txt
          { echo "### Trivy (imagen)"; echo '```'; awk '/^Total|^mediconecta|^opt\// { if (++n <= 20) print }' trivy-imagen.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Informes de Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy
          path: trivy-*.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # OWASP ZAP activo y autenticado contra la API: ataca cada operacion del
  # contrato OpenAPI (inyecciones, path traversal, XSS reflejado...) con un JWT
  # de recepcion. Corta si encuentra alguna alerta High.
  # ---------------------------------------------------------------------------
  zap-activo:
    name: OWASP ZAP activo y autenticado (API)
    runs-on: ubuntu-latest
    needs: [calidad, migraciones]
    steps:
      - uses: actions/checkout@v4

      - name: Secretos y entorno
        run: |
          {
            echo "MEDICONECTA_DB_CLAVE=$(openssl rand -hex 24)"
            echo "MEDICONECTA_JWT_SECRETO=$(openssl rand -base64 48 | tr -d '\n')"
            echo "MEDICONECTA_DEMO_CLAVE=$(openssl rand -hex 12)"
          } > .env
          grep MEDICONECTA_DEMO_CLAVE .env >> "$GITHUB_ENV"
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/mediconecta/api/salud && exit 0; sleep 5; done
          exit 1

      - name: ZAP API scan con JWT de recepcion
        run: |
          TOKEN=$(curl -s -X POST http://localhost:8080/mediconecta/api/auth/login -H 'Content-Type: application/json' \
            -d "{\"usuario\":\"recepcion\",\"clave\":\"$MEDICONECTA_DEMO_CLAVE\"}" | jq -r .token)
          test -n "$TOKEN" && test "$TOKEN" != null
          mkdir -p zap && chmod 777 zap
          # ZAP_AUTH_HEADER_VALUE: los scans empaquetados de ZAP agregan esa cabecera
          # (Authorization por omision) a cada pedido.
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" -e ZAP_AUTH_HEADER_VALUE="Bearer $TOKEN" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:8080/mediconecta/openapi.json -f openapi -J zap-api.json -r zap-api.html -I
          altas=$(jq '[.site[].alerts[] | select(.riskcode=="3")] | length' zap/zap-api.json)
          medias=$(jq '[.site[].alerts[] | select(.riskcode=="2")] | length' zap/zap-api.json)
          echo "### OWASP ZAP activo (API, autenticado): $altas alertas High, $medias Medium" >> "$GITHUB_STEP_SUMMARY"
          test "$altas" -eq 0

      - name: Informe de ZAP activo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-activo
          path: zap/
          if-no-files-found: ignore
